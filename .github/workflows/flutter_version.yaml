name: flutter_version

# mise.toml holds the one Flutter pin. very_good_workflows and flutter-action
# can't read it, so the workflows that set up Flutter call this first and pass
# its output as flutter_version.
on:
  workflow_call:
    outputs:
      version:
        description: "The Flutter version mise.toml pins, without the channel suffix"
        value: ${{ jobs.read.outputs.version }}

jobs:
  read:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: mise.toml
          sparse-checkout-cone-mode: false

      - id: read
        run: |
          version="$(sed -n 's/^flutter = "\([0-9.]*\).*"/\1/p' mise.toml)"
          [ -n "$version" ] || { echo "No flutter pin in mise.toml" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
