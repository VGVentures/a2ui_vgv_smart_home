name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE: home-api

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.12.1

      - name: Build backend
        working-directory: packages/home_backend
        run: |
          dart pub global activate dart_frog_cli
          dart pub get
          dart pub global run dart_frog_cli:dart_frog build
          # dart_frog build writes its own Dockerfile. The package one also
          # copies the prompt assets, without which the server fails at boot.
          cp Dockerfile build/Dockerfile
          # The catalog prompt is a package asset the AOT binary cannot
          # resolve. Without it the model is never told to send ActionChips.
          cp ../home_catalog/lib/src/prompt/catalog-prompt.prompt \
            build/assets/catalog-prompt.prompt
          # Same for the timeline's feed rules.
          cp ../home_timeline/lib/src/feed_rules.json build/assets/feed_rules.json

      - name: Deploy to Cloud Run
        working-directory: packages/home_backend
        run: |
          gcloud run deploy "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --source build \
            --region "${{ vars.GCP_REGION }}" \
            --allow-unauthenticated \
            --max-instances 1 \
            --set-env-vars "^|^HOME_CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}"

      - name: Health check
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          curl -fsS "$URL/health"

  flutter-version:
    uses: ./.github/workflows/flutter_version.yaml

  frontend:
    needs: [backend, flutter-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.flutter-version.outputs.version }}
          cache: true

      - name: Write production config
        env:
          APP_CONFIG_JSON: ${{ secrets.APP_CONFIG_JSON }}
        run: |
          URL=$(gcloud run services describe "$SERVICE" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format='value(status.url)')
          echo "$APP_CONFIG_JSON" | jq --arg url "$URL" '.GENUI_BACKEND_URL = $url' > config.prod.json

      - run: flutter pub get

      # Browsers without WasmGC fall back to the main.dart.js the build also
      # emits.
      - run: flutter build web --release --wasm --dart-define-from-file=config.prod.json

      # firebase.json leaves the site out so a fork deploys to its own. This
      # writes it in from the FIREBASE_SITE variable.
      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_SITE: ${{ vars.FIREBASE_SITE }}
        run: |
          [ -n "$FIREBASE_SITE" ] || { echo "Set the FIREBASE_SITE repository variable to the Hosting site to deploy to." >&2; exit 1; }
          jq --arg site "$FIREBASE_SITE" '.hosting.site = $site' firebase.json > firebase.deploy.json
          mv firebase.deploy.json firebase.json
          npx --yes firebase-tools deploy --only hosting --project "${{ vars.GCP_PROJECT_ID }}"
