name: app_ui
description: The design tokens and presentational widgets of the A2UI VGV Smart Home panel.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0
  material_symbols_icons: ^4.2960.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: HostGrotesk
      fonts:
        - asset: assets/fonts/HostGrotesk.ttf
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono.ttf
