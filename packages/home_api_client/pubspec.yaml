name: home_api_client
description: >-
  The data layer of the A2UI VGV Smart Home panel: talks to the backend over HTTP and
  the /live socket for one visitor's demo world. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  http: ^1.2.0
  web_socket_channel: 3.0.3

dev_dependencies:
  test: ^1.25.6
  very_good_analysis: ^10.1.0
  web_socket: 1.0.1
