name: home_backend
description: A thin Dart Frog proxy between the Flutter panel and the LLM.
version: 1.0.0+1
publish_to: none


environment:
  sdk: ^3.12.0

dependencies:
  dart_frog: ^1.2.6
  # The /transcribe WebSocket route. Pinned to the versions it was built and
  # tested against, like the rest of the voice transcription dependencies.
  dart_frog_web_socket: 1.0.3
  dotenv: ^4.2.0
  dotprompt: ^0.0.1
  # Google's Genkit, with its Gemini plugin: the only provider, called with the
  # key each request brings.
  genkit: ^0.14.1
  genkit_google_genai: ^0.2.9
  home_catalog:
    path: ../home_catalog
  home_timeline:
    path: ../home_timeline
  logging: ^1.3.0
  meta: ^1.16.0
  # Runtime schema builder for Genkit tool inputs (no build_runner codegen).
  schemantic: ^0.2.0
  # The connection from /transcribe to the Gemini Live API.
  web_socket_channel: 3.0.3

dev_dependencies:
  dart_frog_lint: ^0.1.2
  json_schema_builder: ^0.1.3
  mocktail: ^1.0.5
  test: ^1.25.0
