name: home_repository
description: >-
  The repository layer of the A2UI VGV Smart Home panel: users, the scenario clock
  and the live socket, read from the backend. Pure Dart.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  equatable: ^2.0.7
  home_api_client:
    path: ../home_api_client
  meta: ^1.18.0
  web_socket_channel: 3.0.3

dev_dependencies:
  http: ^1.2.0
  test: ^1.25.6
  very_good_analysis: ^10.1.0
  web_socket: 1.0.1
