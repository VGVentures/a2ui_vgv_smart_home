name: a2ui_vgv_smart_home
description: A wall-mounted smart home panel where GenUI composes an A2UI dashboard for each family member.
version: 1.0.0+1
publish_to: none

environment:
  sdk: ^3.12.0
  flutter: ^3.44.0

dependencies:
  app_ui:
    path: packages/app_ui
  bloc: ^9.2.1
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  genui: ^0.9.2
  home_api_client:
    path: packages/home_api_client
  home_catalog:
    path: packages/home_catalog
  home_frontend:
    path: packages/home_frontend
  home_repository:
    path: packages/home_repository
  http: ^1.2.0
  intl: ^0.20.2
  material_symbols_icons: ^4.2960.0
  meta: ^1.19.0
  # Microphone capture for voice input, resampled to the 16 kHz /transcribe
  # expects.
  record: 7.1.1
  # The /transcribe WebSocket.
  url_launcher: ^6.3.3
  web_socket_channel: 3.0.3

dev_dependencies:
  bloc_lint: ^0.4.1
  bloc_test: ^10.0.0
  bloc_tools: ^0.1.0-dev.24
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  plugin_platform_interface: ^2.1.8
  url_launcher_platform_interface: ^2.3.2
  very_good_analysis: ^10.3.0
  # Fake WebSocket peers for the /transcribe client tests.
  web_socket: 1.0.1

flutter:
  generate: true
  uses-material-design: true
